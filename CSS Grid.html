<!DOCTYPE html>
<html>
    <head>
        <title>Grid</title>
        <style>
            header{
                background-color: black;
                color: white;
                text-align: center;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            nav{
                background-color: blue;
                color: white;
                text-align: center;
                padding: 20px;
            }
            nav a{
                color: white;
                text-decoration: underline;
                margin: 20px;
            }
            @media (max-width:600px) {
             .container{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                border-radius: 20px;
                gap: 20px;
            }
               
            }
            .box{
                position: relative;
                background-color: black;
                color: white;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;   
            }
            .box:hover{
                background-color: blueviolet;
                transform:scale(1.15);
                transition:0.5s;
                box-shadow:1px 5px 15px gray;
            }
            .badge{
                position: absolute;
                top: 20px;
                right: 20px;
                background-color: red;
                color: white;
                border-radius: 20px;
                padding: 20px;
            }
            img{
                border-radius: 30px;
                width: 200px;
                height: 200px;
            }
            footer{
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Electronics Store</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Best products</a>
            <a href="#">Contact</a>
        </nav>
        <main>
            <div class="container">
                <div class="box">
                    <div class="badge">New✨</div>
                    <img src="Phone.png" alt="Phone">
                    <h2>Samsung S26 Ultra</h2>
                    <p><span>₹1,39,000</span></p>
                </div>
                <div class="box">
                    <img src="Laptop.png">
                    <h2>ASUS TUF Gaming A15 </h2>
                    <p><span>₹66,990</span></p>
                </div>
                <div class="box">
                    <img src="Smart Watch.png">
                    <h2>Smart Watch</h2>
                </div>
                <div class="box">
                    <img src="Laptop Mouse.png">
                    <h2>Mouse</h2>
                </div>
                <div class="box">
                    <img src="Keyboard.png">
                    <h2>Keyboard</h2>
                </div>
                <div class="box">
                    <img src="SSD.png">
                    <h2>SSD</h2>
                </div>
            </div>
        </main>
        <footer>
            © 2026 Electronics Store
        </footer>
    </body>
</html>
