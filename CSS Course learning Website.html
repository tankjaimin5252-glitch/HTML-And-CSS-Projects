<!DOCTYPE html>
<html>
    <head>
        <title>Online course Learning</title>
        <style>
            .card{
                background-color: white;
                color: black;
                font-size: 25px;
                width: 250px;
                min-height: 250px;
                border: 5px solid black;
                border-radius: 25px;
                display: inline-block;
                padding: 20px;
                margin: 25px;
            }
            .card:hover{
                background-color: black;
                box-shadow: 10px 10px 20px blue;
                transform: rotate(5deg);
                color: white;
                transition:0.5s;
                
            }
            h1{
                background-color: black;
                color: white;
                text-align: center;
                border-radius: 30px;
                padding: 20px;
                margin: 50px;
            }
            body{
                background-color: lightblue;
            }
            a{
                color: blueviolet;
                border: 5px solid black;
                border-radius: 25px;
                padding: 20px;
                margin: 20px;
            }
            a:hover{
                background-color: black;
                color: white;
                transform:translateY(-15px);
            }
            h2{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                font-family: cursive;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            main{
                background-color: darkblue;
                color: white;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            button{
                background-color: cornflowerblue;
                color: navy;
                font-size: 20px;
                border: 5px solid black;
                border-radius: 20px;
                padding: 20px;
            }
            button:hover{
                background-color: darkorange;
                color: black;
                transition:0.5s;
                transform:scale(1.05);
            }
            form{
                background-color: lightcoral;
                color: white;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            label{
                color: navy;
                font-size: 20px;
                padding: 20px;
                margin: 20px;
            }
            input{
                font-size: 20px;
                padding: 20px;
                margin: 20px;
            }
            select{
                font-size: 20px;
                padding: 20px;
                margin: 20px;
            }
            footer{
                color: black;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Skill Academy</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <br><br>
        </nav>
        <main>
            <h2>Popular Courses✨</h2>
            <div class="card">
                Python🐍
                <ul>
                    <li>Begineer</li>
                    <li>₹999</li>
                </ul>
                <button type="submit">Enroll</button>
            </div>
            <div class="card">
                Web design🌐
                <ul>
                    <li>Begineer</li>
                    <li>₹799</li>
                </ul>
                <button type="submit">Enroll</button>
            </div>
            <div class="card">
                Java
                <ul>
                    <li>Begineer</li>
                    <li>₹1200</li>
                </ul>
                <button type="submit">Enroll</button>
            </div>
            <form>
                <h2>Enrollment Form</h2>
                <label>NAME:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <br><br>
                <label>Email:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <br><br>
                <label>MOBILE:</label>
                <input type="tel" placeholder="ENTER YOUR NUMBER">
                <br><br>
                <label>SELECT YOUR COURSES:</label>
                <select>
                    <option>Python</option>
                    <option>Web Design</option>
                    <option>Java</option>
                </select>
                <br><br>
                <button type="submit">Buy Now!</button>
            </form>
        </main>
        <footer>
            © 2026 Course Learning
        </footer>
    </body>
</html>
