<!DOCTYPE html>
<html>
    <head>
        <title>Fitness Center Website</title>
        <style>
            h1{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 30px;
                font-family: monospace;
                border: 4px solid wheat;
                border-radius: 20px;
                padding: 20px;
                margin: 20px;
            }
            body{
                background-color: #F0EEE9;
            }
            nav{
                background-color: cornflowerblue;
                color: navy;
                border: 2px solid black;
                border-radius: 20px;
                padding: 20px;
                margin: 20px;
            }
            a{
                color: navy;
                font-size: 20px;
                text-decoration: underline;
                padding: 15px;
                margin: 15px;
            }
            h2{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                border: 4px solid navy;
                border-radius: 20px;
                padding: 20px;
                margin: 20px;
            }
            main{
                background-color: #9932CC;
                color: white;
                border: 4px solid black;
                border-radius: 20px;
                padding: 20px;
                margin: 20px;
            }
            section{
                background-color: navy;
                color: white;
                border: 2px solid navy;
                border-radius: 20px;
                padding: 20px;
                margin: 50px;
            }
            p{
                background-color: chartreuse;
                color: navy;
                font-size: 20px;
                border: 4px solid chartreuse;
                border-radius: 20px;
                padding: 15px;
                margin: 15px;
            }
            ul{
                background-color: chartreuse;
                color: navy;
                font-size: 20px;
                border: 2px solid chartreuse;
                border-radius: 20px;
                padding: 25px;
            }
            form{
                background-color: lightblue;
                color: navy;
                font-size: 25px;
                border: 2px solid black;
                border-radius: 20px;
                padding: 20px;
                margin: 20px;
            }
            input{
                font-size: 15px;
                padding: 10px;
                border-radius: 20px;
                margin: 15px;
            }
            select{
                font-size: 15px;
                padding: 20px;
                border-radius: 20px;
                margin: 15px;
            }
            img{
                border: 4px solid black;
                border-radius: 20px;
                margin: 25px;
            }
            button{
                background-color: black;
                color: beige;
                font-size: 25px;
                padding: 20px;
                border: 5px solid darkblue;
                border-radius: 20px;
                margin: 20px;
            }
            footer{
                color: black;
                padding: 15px;
                margin: 15px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Fitness Center</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <br><br>
            <a href="#">Trainers</a>
            <br><br>
            <a href="#">Membership</a>
            <br><br>
            <a href="#">Contact</a>
            <br><br>
        </nav>
        <main>
            <section>
            <h2>Welcome to Fitlife</h2>
            <img src="Fitness gym center.png" alt="gym" width="300" height="300">
            <p>Trust. Transformation. Fitline.</p>
            </section>
            <hr>
            <section>
                <h2>Services</h2>
                <ul>
                    <li>Gym Training</li>
                    <li>Cardio</li>
                    <li>Personal Trainer</li>
                    <li>Yoga</li>
                </ul>
            </section>
            <hr>
            <section>
                <form>
                    <h2>Membership Form</h2>
                    <label>NAME:</label>
                    <input type="text" placeholder="ENTER YOUR NAME">
                    <br><br>
                    <label>EMAIL:</label>
                    <input type="email" placeholder="ENTER YOUR EMAIL">
                    <br><br>
                    <label>MOBILE:</label>
                    <input type="tel" placeholder="ENTER YOUR NUMBER">
                    <br><br>
                    <label>AGE:</label>
                    <input type="number" placeholder="ENTER YOUR AGE">
                    <br><br>
                    <label>SELECT PLAN:</label>
                    <select>
                        <option>MONTHLY</option>
                        <option>YEARLY</option>
                    </select>
                    <br><br>
                    <button type="submit">Join Now</button>
                </form>
            </section>
        </main>
        <footer>
            © 2026 Fitness Center Website
        </footer>
    </body>
</html>
