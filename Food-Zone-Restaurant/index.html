<!DOCTYPE html>
<html>
    <head>
        <title>Food Zone Resturant</title>
        <style>
            .card{
                background-color: black;
                color: white;
                font-size: 25px;
                width: 300px;
                height: 300px;
                border: 4px solid purple;
                border-radius: 30px;
                display: inline-block;
                padding: 20px;
                margin: 25px;
            }
            header{
                background-color: darkblue;
                border: 5px lightcoral;
                border-radius: 25px;
                padding: 20px;
                margin: 20px;
            }
            h1{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                border: 5px solid blue;
                border-radius: 25px;
                padding: 20px;
                margin: 20px;
            }
            p{
                background-color: lawngreen;
                color: black;
                font-size: 20px;
                border: 4px solid lawngreen;
                border-radius: 30px;
                padding: 20px;
                margin: 25px;
            }
            body{
                background-color: skyblue;
            }
            nav{
                color: navy;
                font-size: 20px;
                text-decoration: underline;
                border: 5px solid black;
                border-radius: 50px;
                padding: 20px;
                margin: 50px;
            }
            a{
                color: navy;
                padding: 20px;
                margin: 20px;
            }
            main{
                background-color: cornflowerblue;
                color: cornsilk;
                border: 2px solid cornflowerblue;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            h2{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                border: 5px solid blue;
                border-radius: 25px;
                padding: 20px;
                margin: 20px;
            }
            form{
                background-color: darkorchid;
                color: white;
                font-size: 25px;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            button{
                background-color: navy;
                color: white;
                font-size: 25px;
                border: 4px solid black;
                border-radius: 20px;
                padding: 25px;
                margin: 20px;
            }
            input{
                font-size: 25px;
            }
            select{
                font-size: 25px;
            }
            footer{
                color: black;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Food Zone Resturant🍕</h1>
            <p>Welcome to Food Zone Restaurant</p>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About Us</a>
            <a href="#">Offers</a>
            <a href="#">contanct</a>
        </nav>
        <main>
            <h2>Food Section</h2>
            <div class="card">
                pizza🍕
                <img src="Pizza.png" width="100px" height="100px">
            <ul>
                <li>Cheese Pizza</li>
                <li>Price₹299</li>
            </ul>
            </div>
            <div class="card">
                Burger🍔
                <ul>
                    <li>Veg Burger</li>
                    <li>Price:₹149</li>
                </ul>
            </div>
            <div class="card">
                pasta🍝
                <ul>
                    <li>Italian Pasta</li>
                    <li>price:₹199</li>
                </ul>
            </div>
            <form>
                <label>NAME:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <br><br>
                <label>EMAIL:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <br><br>
                <label>SELECT FOOD</label>
                <select>
                    <option></option>
                    <option>Pizza</option>
                    <option>Burger</option>
                    <option>pasta</option>
                </select>
                <br><br>
                <label>QUANTITY:</label>
                <input type="text">
                <br><br>
                <button type="submit">Order Now</button>
            </form>
        </main>
        <footer>
            © 2026 Food Zone Resturant
        </footer>
    </body>
</html>
