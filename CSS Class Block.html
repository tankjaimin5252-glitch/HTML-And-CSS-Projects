<!DOCTYPE html>
<html>
    <head>
        <title>Blpck Making</title>
        <style>
            .box{
                background-color: black;
                color: white;
                font-size: 25px;
                text-align: center;
                line-height: 200px;
                width: 200px;
                height: 200px;
                border: 2px solid purple;
                border-radius: 30px;
                display: inline-block;
                padding: 20px;
                margin: 20px;
            }
        </style>
    </head>
    <body>
        <div class="box">
            Laptop
        </div>
        <div class="box">
            Mobile
        </div>
    </body>
</html>
