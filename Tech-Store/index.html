<!DOCTYPE html>
<html>
    <head>
        <title>Tech Store</title>
        <style>
            body{
                background-color: #f2f2f2;
                font-family: arial;
            }
            header{
                background-color: black;
                color: white;
                text-align: center;
                padding:20px;
            }
            nav{
                background-color: #0d6efd;
                text-align: center;
                padding: 15px;
            }
            nav a{
                color: white;
                text-decoration:underline;
                margin: 20px;
                font-size: 20px;
            }
            main{
                padding: 30px;
            }
            h2{
                text-align: center;
            }
            .products{
                display:flex;
                justify-content:space-evenly;
                flex-wrap:wrap;
            }
            .card{
                background-color:#ffffff;
                width:250px;
                border-radius: 30px;
                box-shadow:0px 5px 15px gray;
                padding: 20px;
                margin: 20px;
                text-align: center;
            }
            .card img{
                width: 150px;
                height: 150px;
            }
            .card:hover{
                transform:scale(1.05);
                transition:0.5s;
                background-color:beige;
            }
            button{
                background-color:blue;
                color: white;
                border:none;
                border-radius: 10px;
                font-size: 20px;
                padding: 20px;
            }
            button:hover{
                background-color: black;
                transition:0.5s;
            }
            form{
                background-color: white;
                width: 500px;
                margin: auto;
                padding: 25px;
                border-radius:30px;
                box-shadow:0px 5px 15px gray;
            }
            input,select{
                width:100%;
                padding:10px;
                margin-top: 10px;
                margin-bottom:20px;
            }
            footer{
                color: black;
                text-align: center;
                font-size: 15px;
                padding:20px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Tech Store</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Offers</a>
            <a href="#">Contact</a>
        </nav>
        <main>
            <h2>Feature Products</h2>
            <div class="products">
                <div class="card">
                    <img src="Laptop.png" alt="Gaming Laptop">
                    <h3>Gaming Laptop</h3>
                    <p>₹89,999</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="products">
                <div class="card">
                    <img src="Phone.png" alt="Phone">
                    <h3>SmartPhone</h3>
                    <p>₹30,000</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="products">
                <div class="card">
                    <img src="Smart Watch.png">
                    <h3>Smart Watch</h3>
                    <p>₹4999</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="products">
                <div class="card">
                    <img src="Headphone.png">
                    <h3>Headphone</h3>
                    <p>₹4,000</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <h2>Order Form</h2>
            <form>
                <label>Name:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <label>EMAIL:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <label>Select product:</label>
                <select>
                    <option>Gaming Laptop</option>
                    <option>smartphone</option>
                    <option>Smart Watch</option>
                    <option>Headphone</option>
                </select>
                <button type="submit">Place Order</button>
            </form>
        </main>
        <footer>
            © 2026 Tech Store
        </footer>
    </body>
</html>
