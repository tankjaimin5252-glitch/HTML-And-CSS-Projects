<!DOCTYPE html>
<html>
    <head>
        <title>Student Report Card</title>
        <style>
            header{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                font-family: monospace;
                border: 3px solid cyan;
                padding: 25px;
            }
            body{
                background-color: skyblue;
            }
            nav{
                color: darkblue;
                font-size: 20px;
                font-family: Verdana;
                border: 2px solid blue;
                padding: 20px;
            }
            a{
                color: blue;
            }
            main{
                background-color: blueviolet;
                color: white;
                font-size: 22px;
                border: 4px solid black;
                padding: 24px;
            }
            button{
                background-color: black;
                color: white;
                font-size: 20px;
                border: 2px solid white;
                padding: 5px;
            }
            footer{
                background-color: darkorchid;
                color: lime;
                font-size: 10px;
                text-align: left;
            }
            h2{
                background-color: black;
                color: white;
                border: 2px solid white;
                padding: 16px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Student Report Card</h1>
        </header>
        <nav>
            <a href="#Home">Home</a>
            <br><br>
            <a href="#Your Profile">Your Profile</a>
            <br><br>
            <a href="#Exam form">Exam form</a>
            <br><br>
            <a href="Contact">Contact</a>
        </nav>
        <main>
            <h2>Fill This Form⬇️</h2>
            <form>
                <label>NAME:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <br><br>
                <label>EMAIL:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <br><br>
                <label>ENROLLMENT NUMBER:</label>
                <input type="tel" placeholder="ENTER YOUR ENROLLMENT NUMBER">
                <br><br>
                <label>DEPARTMENT:</label>
                <select>
                    <option>Information technology</option>
                    <option>Civil Engineering</option>
                    <option>Computer Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Ec</option>
                </select>
                <br><br>
                <label>SEM:</label>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
                <br><br>
                <label>Percentage</label>
                <input type="tel">
                <br><br>
                <button type="submit">REGISTER</button>
            </form>
        </main>
        <footer>
            <p>© 2026 Student Report Card</p>
        </footer>
    </body>
</html>
