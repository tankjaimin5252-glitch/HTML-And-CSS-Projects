<!DOCTYPE html>
<html>
    <head>
        <title>Student Id-Card</title>
        <style>
            h1{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                font-family: Verdana;
                border: 2px solid green;
            }
            body{
                background-color: lightgray;
            }
            a{
                color: darkblue;
                font-size: 20px;
                font-family: serif;
            }
            nav{
                border: 1px solid blue;
            }
            h2{
                background-color: chartreuse;
                color: black;
                border: 2px dotted red;
                font-family: verdana;
            }
            main{
                background-color: darkorange;
                color: white;
                border: 4px double purple;
                font-size: 18px;
            }
            button{
                background-color: black;
                color: white;
                font-size: 22px;
                font-family: initial;
                text-align: left;
                border: 4px solid lightskyblue;
            }
            footer{
                font-family: sans-serif;
                font-size: 10px;
                border: 1px solid lightblue;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>college Id</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <br><br>
            <a href="#">About College</a>
            <br><br>
            <a href="#">contact</a>
            <br><br>
        </nav>
        <main>
            <h2>Fill This Form</h2>
            <form>
                <label>NAME:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <br><br>
                <label>EMAIL:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <br><br>
                <label>MOBILE:</label>
                <input type="tel" placeholder="ENTER YOUR NUMBER">
                <br><br>
                <label>Department:</label>
                <select>
                    <option>Information technology</option>
                    <option>Civil Engineering</option>
                    <option>Computer Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Ec</option>
                </select>
                <br><br>
                <label>SEM:</label>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
                <br><br>    
                <button type="submit">REGISTER</button>
            </form>
        </main>
        <footer>
            <p>© 2026 College Id</p>
        </footer>
    </body>
</html>
