<!DOCTYPE html>
<html>
    <head>
        <title>PC Build Store</title>
        <style>
            body{
                background-color:#f0f0f0;
                font-family:Arial;
            }
            header{
                background-color: black;
                color: white;
                text-align: center;
                border-radius:30px;
                padding:20px;
                margin:auto;
            }
            nav{
                background-color:#0d6efd;
                color: white;
                text-align: center;
                padding: 20px;
                border-radius: 30px;
                margin:20px;
            }
            nav a{
                color: wheat;
                text-decoration: underline;
                font-size: 20px;
                margin:20px;
            }
            nav a:hover{
                color:darkblue;
                transition:0.5s;
            }
            main{
                background-color: white;
                padding: 20px;
                margin: 20px;
                border-radius:30px;
            }
            h2{
                background-color: black;
                color: white;
                text-align: center;
                border-radius:30px;
                padding:20px;
                margin:auto;
            }
            .products{
                display: flex;
                justify-content:space-evenly;
                flex-wrap: wrap;
            }
            .card{
                position: relative;
                background-color: white;
                width: 250px;
                border-radius:30px;
                padding: 20px;
                margin: 50px;
                text-align: center;
                box-shadow: 0px 10px 20px gray;
            }
            .card img{
                width: 150px;
                height: 150px;
            }
            .card:hover{
                background-color:beige;
                transform:scale(1.05);
                transition:0.5s;
            }
            .badge{
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: red;
                color: white;
                border-radius: 20px;
                padding: 20px;
            }
            button{
                background-color: blueviolet;
                color: white;
                font-size: 20px;
                border-radius: 30px;
                padding: 20px;
            }
            button:hover{
                background-color: white;
                color: blueviolet;
            }
            form{
                background-color: white;
                width:500px;
                margin: auto;
                padding: 20px;
                border-radius: 30px;
                box-shadow:0px 10px 15px gray;
            }
            form:hover{
                transform:scale(1.05);
                transition:0.5s;
            }
            input,select{
                font-size: 25px;
                width: 80%;
                padding: 15px;
                margin: 20px;
            }
            footer{
                font-size: 15px;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>PC Build Store</h1>
        </header>
        <nav>
            <a href="#">HOME</a>
            <a href="#">Component</a>
            <a href="#">Offers</a>
            <a href="#">Contacts</a>
        </nav>
        <main>
            <h2>Components</h2>
            <div class="products">
                <div class="card">
                    <div class="badge">BEST SELLER😊</div>
                    <img src="Prosesor.png" alt="RYZEN 7 7800X3D">
                    <h3>RYZEN 7 7800X3D</h3>
                    <p>₹34,499</p>
                    <button>BUY NOW</button>
                </div>
            </div>
            <div class="products">
                <div class="card">
                    <div class="badge">NEW✨</div>
                    <img src="DDR5 RAM.png" alt="32GB DDR5 RAM">
                    <h3>32GB DDR5 RAM</h3>
                    <p>₹9,999</p>
                    <button>BUY NOW</button>
                </div>
            </div>
            <div class="products">
                <div class="card">
                    <img src="SSD Pendrive.png" alt="SSD Pendrive">
                    <h3>1TB NVMe SSD</h3>
                    <p>₹6,499</p>
                    <button>BUY NOW</button>
                </div>
            </div>
            <form>
                <label>NAME:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <label>EMAIL:</label>
                <input type="email" placeholder="ENTER YOUR EMAIL">
                <label>SELECT COMPONENT:</label>
                <select>
                    <option>RYZEN 7 7800X3D</option>
                    <option>32GB DDR5 RAM</option>
                    <option>1TB NVMe SSD</option>
                </select>
                <button type="submit">BUY NOW</button>
            </form>
        </main>
        <footer>
            ©2026 PC Build Store
        </footer>
    </body>
    </html>
