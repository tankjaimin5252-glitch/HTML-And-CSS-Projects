<!DOCTYPE html>
<html>
    <head>
        <title>Movie Website</title>
        <style>
            .movie-container{
                background-color: black;
                color: white;
                font-size: 25px;
                width: 300px;
                height: 300px;
                border-radius: 30px;
                display: flex;
                justify-content:center;
                justify-content: space-between;
                flex-wrap:wrap;
                padding: 20px;
                margin: 25px;
            }
            .movie-container:hover{
                background-color: white;
                color: black;
                box-shadow: 10px 20px 30px black;
                transition:0.5s;
            }
            body{
                background-color: aqua;
            }
            h1{
                background-color: black;
                color: white;
                text-align: center;
                font-size: 25px;
                font-family: monospace;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 50px;
            }
            a{
                background-color: darkblue;
                color: white;
                font-size: 20px;
                border: 3px solid black;
                border-radius: 30px;
                padding: 25px;
                margin: 50px;                
            }
            a:hover{
                background-color: white;
                color: darkblue;
                border: 3px solid blue;
                border-radius: 20px;
                box-shadow: 10px 20px 10px black;
                transition:0.5s;
            }
            main{
                background-color: cornflowerblue;
                color: blue;
                border: 5px solid black;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            h2{
                background-color: black;
                color: white;
                text-align: center;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            form{
                background-color: blueviolet;
                color: white;
                font-size: 25px;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            img{
                width: 100px;
                height: 100px;
            }
            img:hover{
                width: 200px;
                height: 200px;
                border: 3px solid black;
                border-radius: 50px;
                transition: 0.5s;
            }
            label{
                font-size: 25px;
            }
            input{
                font-size: 25px;
            }
            select{
                font-size: 25px;
            }
            button{
                background-color: black;
                color: white;
                border-radius: 30px;
                padding: 20px;
                margin: 20px;
            }
            button:hover{
                background-color: white;
                color: black;
                transition:0.5s;
            }
            footer{
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Cinewave</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">search</a>
            <a href="#">Contact</a>
            <br><br>
            <br><br>
        </nav>
        <main>
            <div class="movie-container">
                <div class="card">
                    <img src="movie1.png" alt="Avenger movie">
                    <ul>
                        <li>Avengers</li>
                        <li>Action Movie</li>
                        <li><span>₹299</span></li>
                    </ul>
                    <button type="submit">Watch Now</button>
                </div>
            </div>
            <div class="movie-container">
                <div class="card">
                    <img src="movie.png" alt="Avatar Movie">
                    <ul>
                        <li>Avatar Movie</li>
                        <li>Sci-Fi</li>
                        <li><span>₹199</span></li>
                    </ul>
                    <button type="submit">Watch NOW</button>
                </div>
            </div>
            <div class="movie-container">
                <div class="card">
                    <img src="movie2.png">
                    <ul>
                        <li>Spider Man</li>
                        <li><span>₹450</span></li>
                    </ul>
                    <button type="submit">Watch Now</button>
                </div>
            </div>
            <form>
                <h2>Fill Form</h2>
                <label>Name:</label>
                <input type="text" placeholder="ENTER YOUR NAME">
                <br><br>
                <label>SELECT MOVIE:</label>
                <select>
                    <option>AVENGER MOVIE</option>
                    <option>AVTAR MOVIE</option>
                    <option>SPIDER MAN MOVIE</option>
                </select>
                <br><br>
                <button type="submit">REGISTER</button>
            </form>
        </main>
        <footer>
            © 2026Cinewave
        </footer>
    </body>
</html>
